[project]
name = "qlib-tw"
version = "0.1.0"
description = "台股（上市）個股 Qlib 資料集與選股實驗"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyqlib==0.9.7",
    "requests",
    "truststore",
    "pandas>=2.2,<3",
    "pyarrow",
    "lightgbm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tw_qlib"]
