# 每個交易日晚上：抓新資料 → 固定模型排名 → 更新 state/（commit 回 repo）→ 部署網頁到 GitHub Pages
# 證交所的融資融券約晚上 9 點後公布，所以排在台灣時間 21:30，23:30 再跑一次補漏。
name: daily-ranking

on:
  schedule:
    - cron: "30 13 * * 1-5"  # 台灣時間 21:30（UTC+8）
    - cron: "30 15 * * 1-5"  # 台灣時間 23:30，資料晚公布時補抓
  workflow_dispatch:
  push:  # 網頁或產生網頁的程式有改動時，推上來就重新部署
    branches: [main]
    paths: ["site/index.html", "build_site.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安裝套件
        run: uv sync --frozen

      - name: 每日更新
        run: uv run python run_daily.py

      - name: 保存 state（近期原始資料與排名歷史）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "data: $(TZ=Asia/Taipei date +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
