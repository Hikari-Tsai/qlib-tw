# 台股（上市）Alpha158 + LightGBM 選股實驗
# 執行（在 qlib_tw 資料夾內）：uv run qrun workflow_tw_alpha158_lgbm.yaml
#
# 時間切分（資料結尾 2026-11-05，最後 5 年 2021-11-05 起為保留集，這裡完全不載入）：
#   訓練 2008-01-01 ~ 2016-12-31
#   驗證 2017-01-01 ~ 2018-12-31
#   測試 2019-01-01 ~ 2021-11-04
qlib_init:
    provider_uri: "./qlib_data"
    region: tw                       # Qlib 內建台股區域：trade_unit 1000、deal_price close
    kernels: 6                       # 平行讀取的子行程數；預設等於 CPU 數（32），Windows 上每個子行程都重載 Qlib，會耗盡記憶體
market: &market tw100                # 每月依前 60 日平均成交金額更新的前 100 名（含已下市股票）
benchmark: &benchmark TWII           # 加權指數
data_handler_config: &data_handler_config
    start_time: 2008-01-01
    end_time: 2021-11-04
    fit_start_time: 2008-01-01
    fit_end_time: 2016-12-31
    instruments: *market
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy   # 只做多
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 20
            n_drop: 3
    backtest:
        start_time: 2019-01-01
        end_time: 2021-11-04
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            # 用自訂交易所：漲跌停以資料中的 $limit_up／$limit_down 旗標判斷
            # （2015-06-01 前 ±7%、之後 ±10%，並考慮升降單位；浮點門檻 0.1 在台股幾乎判斷不到漲停）
            exchange:
                class: TWExchange
                module_path: tw_qlib.exchange
                kwargs:
                    freq: day
                    start_time: 2019-01-01
                    end_time: 2021-11-04
                    codes: *market
                    limit_threshold: ["$limit_up", "$limit_down"]
                    deal_price: close
                    trade_unit: 1000
                    open_cost: 0.001425      # 手續費 0.1425%
                    close_cost: 0.004425     # 手續費 0.1425% + 證交稅 0.3%
                    min_cost: 20             # 最低手續費 20 元
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 8
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2008-01-01, 2016-12-31]
                valid: [2017-01-01, 2018-12-31]
                test: [2019-01-01, 2021-11-04]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
